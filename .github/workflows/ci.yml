name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  node-build-test:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: |
          if npm run | grep -qE '^  lint$'; then
            npm run lint
          else
            echo 'No lint script configured; advisory check skipped.'
          fi
      - name: Build
        run: npm run build
      - name: Run Tests
        run: npm test
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t test-image .
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Run Benchmarks
        run: bash benchmarks/run.sh
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cache-benchmark-results
          path: benchmarks/results/
          retention-days: 90
