# Standard Helm / GitOps values override for semantic-llm-cache
replicaCount: 2
image:
  repository: ghcr.io/sumitdalavi/semantic-llm-cache
  tag: v0.2.0
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
